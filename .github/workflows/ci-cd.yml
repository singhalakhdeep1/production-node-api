name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: production_api
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/production_api
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Migrate and smoke-test the built server
        run: |
          npm run migrate
          node dist/src/server.js &
          for i in $(seq 1 30); do curl -fs localhost:5000/api/health/ready && break; sleep 1; done
          curl -fs localhost:5000/api/health | grep -q '"status":"healthy"'
          curl -fs localhost:5000/metrics | grep -q http_requests_total
          kill %1
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend-test/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    needs: [api, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t production-api:${{ github.sha }} .
          docker build -t production-frontend:${{ github.sha }} frontend-test
      - name: Validate compose file
        run: docker compose config -q
      - name: Push to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.DOCKER_USERNAME != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          for img in production-api production-frontend; do
            docker tag $img:${{ github.sha }} $DOCKER_USERNAME/$img:latest
            docker push $DOCKER_USERNAME/$img:latest
          done

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - name: Deploy over SSH
        if: env.SERVER_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/production-api
            git pull --ff-only
            docker compose pull
            docker compose up -d --build --remove-orphans
            docker image prune -f
