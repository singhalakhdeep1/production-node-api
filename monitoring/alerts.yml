# Prometheus alert rules for the API (routed by Alertmanager to the API's PagerDuty webhook).
groups:
  - name: api_alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "5xx ratio is {{ $value | humanizePercentage }} over 5m"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High response time"
          description: "p95 latency is {{ $value }}s"

      - alert: ServiceDown
        expr: up{job="production-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API instance is down"
          description: "{{ $labels.instance }} is unreachable"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="production-api"} / 1024 / 1024 > 450
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "{{ $labels.instance }} RSS is {{ $value }}MB"

      - alert: CircuitBreakerOpen
        expr: max by (breaker) (circuit_breaker_state) == 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker {{ $labels.breaker }} is open"
          description: "A dependency is failing and calls are being short-circuited"

      - alert: LoadShedding
        expr: sum(rate(load_shed_requests_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API is shedding load"
          description: "Requests are being rejected with 503 due to event loop saturation"
