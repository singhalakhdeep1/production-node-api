# Prometheus scrape config (docker-compose service names).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - alerts.yml

scrape_configs:
  # Each replica is scraped directly (not through nginx) so per-instance series stay separate.
  - job_name: production-api
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['api1:5000', 'api2:5000', 'api3:5000']
        labels:
          env: production

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
