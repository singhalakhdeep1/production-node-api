# PROMETHEUS CONFIGURATION
#
# CURRICULUM COVERAGE:
# #2251-2265: Prometheus metrics, scraping, alerting

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Rules for alerts
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  - job_name: 'production-api'
    static_configs:
      - targets: ['localhost:5000']
        labels:
          env: 'production'
    
    metrics_path: '/metrics'
    scrape_interval: 10s
  
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
  
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
