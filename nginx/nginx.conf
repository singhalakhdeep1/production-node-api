# NGINX reverse proxy / load balancer for the API replicas (used by docker-compose).
# For a TLS edge, see the commented server block at the bottom.
worker_processes auto;
events { worker_connections 2048; }

http {
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '$request_time $upstream_addr "$http_x_correlation_id"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;          # uploads: up to 10 x 10MB per request
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript;

    # Edge rate limit shared by all replicas (the app adds per-IP and per-principal limits).
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream backend {
        least_conn;
        server api1:5000 max_fails=3 fail_timeout=15s;
        server api2:5000 max_fails=3 fail_timeout=15s;
        server api3:5000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        location / {
            limit_req zone=api_limit burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
        }

        # WebSockets: /ws and GraphQL subscriptions on /graphql
        location ~ ^/(ws|graphql)$ {
            proxy_pass http://backend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
        }

        location /api/health {
            access_log off;
            proxy_pass http://backend;
        }

        # Metrics are for Prometheus on the internal network only.
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://backend;
        }
    }

    # TLS edge (production): mount certificates and enable.
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name api.example.com;
    #     ssl_certificate     /etc/ssl/certs/cert.pem;
    #     ssl_certificate_key /etc/ssl/private/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #     location / { proxy_pass http://backend; }
    # }
}
